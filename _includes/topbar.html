<header class="topbar">
  <button class="hamburger" onclick="toggleSidebar()" aria-label="Open sidebar"><i data-lucide="menu"></i></button>
  <a href="{{ '/' | relative_url }}" class="topbar-logo">
    <img src="{{ '/assets/images/logo.jpeg' | relative_url }}" alt="Walton Robotics">
    <div>
      <div class="topbar-name">WRT Programming</div>
      <div class="topbar-sub">Team 2974 · {{ site.season }}</div>
    </div>
  </a>
  <div class="topbar-sep"></div>
  <nav class="topbar-links">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}class="active"{% endif %}>home</a>
    <a href="{{ '/training' | relative_url }}" {% if page.page_id == 'training' or page.phase == 'summer' or page.phase == 'bridge' or page.phase == 'offseason' %}class="active"{% endif %}>training</a>
    <a href="{{ '/project' | relative_url }}" {% if page.page_id == 'project' %}class="active"{% endif %}>project</a>
    <a href="{{ '/style-guide' | relative_url }}" {% if page.url contains 'style-guide' %}class="active"{% endif %}>style guide</a>
  </nav>
  <button class="topbar-search-btn" onclick="openSearch()" title="Search (Ctrl+K / ⌘K)"><i data-lucide="search"></i></button>
  <a href="{{ '/login/' | relative_url }}" class="topbar-signin-btn" id="topbar-signin-static">sign in</a>
</header>
