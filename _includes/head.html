<!-- Primary Meta -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A4A">
<meta name="description" content="{% if page.subtitle %}{{ page.subtitle }}{% else %}{{ site.description }}{% endif %}">
<meta name="author" content="{{ site.author.name }}">

<!-- Title -->
<title>{% if page.title %}{{ page.title }} | WRT Programming{% else %}{{ site.title }}{% endif %}</title>

<!-- Favicon -->
<link rel="icon" type="image/jpeg" href="{{ '/assets/images/logo.jpeg' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/logo.jpeg' | relative_url }}">

<!-- Open Graph -->
<meta property="og:type"        content="website">
<meta property="og:site_name"   content="{{ site.title }}">
<meta property="og:title"       content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{% if page.subtitle %}{{ page.subtitle }}{% else %}{{ site.description }}{% endif %}">
<meta property="og:url"         content="{{ page.url | absolute_url }}">
<meta property="og:image"       content="{{ '/assets/images/logo.jpeg' | absolute_url }}">

<!-- Twitter Card -->
<meta name="twitter:card"        content="summary">
<meta name="twitter:title"       content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta name="twitter:description" content="{% if page.subtitle %}{{ page.subtitle }}{% else %}{{ site.description }}{% endif %}">

<!-- Jekyll SEO tag (handles canonical, structured data, etc.) -->
{% seo %}

<!-- Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<!-- Lucide icons (inline SVG, no build step required) -->
<script src="https://cdn.jsdelivr.net/npm/lucide@0.511.0/dist/umd/lucide.min.js"></script>

<!-- Feed -->
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
